{% extends "base.html" %}
{% block title %}import{% endblock %}
{% block body %}
<h2>upload pdf</h2>
<div class="panel">
  <form method="post" action="/import" enctype="multipart/form-data">
    <input type="file" name="files" accept="application/pdf" multiple required>
    <button class="btn" type="submit">parse + ingest</button>
  </form>
</div>

{% if results %}
<h2>results</h2>
<table class="grid">
  <thead><tr><th>file</th><th>type</th><th class="r">tx</th><th class="r">warnings</th><th>doc_id</th></tr></thead>
  <tbody>
  {% for r in results %}
    <tr>
      <td>{{ r.filename }}</td>
      <td>{{ r.type }}</td>
      <td class="r mono">{{ r.tx }}</td>
      <td class="r mono">{{ r.warnings }}</td>
      <td><a href="/documents/{{ r.doc_id }}" class="mono muted">{{ r.doc_id }}</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
